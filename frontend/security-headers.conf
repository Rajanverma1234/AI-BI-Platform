# Security headers for the static frontend.
#
# In its own file because nginx's `add_header` does not merge across levels: a
# `location` block that adds any header of its own discards every `add_header`
# inherited from the `server` block. Including this snippet in each location
# that sets a header keeps them from silently disappearing.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

# The bundle is self-contained: no inline scripts, no third-party origins.
# `connect-src *` is required because the API host is a deploy-time choice;
# narrow it to the actual API origin once that is fixed for a deployment.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
