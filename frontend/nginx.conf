# Serves the built SPA. The API is a separate origin, reached directly by the
# browser using VITE_API_BASE_URL, so nginx does not proxy it - keeping one
# place (the backend's CORS configuration) in charge of who may call the API.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx build.
    server_tokens off;

    # Included per-location rather than set once here: nginx drops inherited
    # `add_header` directives in any block that adds one of its own.
    include /etc/nginx/conf.d/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy will not be picked up.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths render the SPA rather than 404.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
