[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aibi-backend"
version = "0.1.0"
description = "AI Business Intelligence Platform - backend API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic[email]>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    # Argon2id password hashing and JWT access tokens.
    "argon2-cffi>=23.1.0,<26.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    # Multipart uploads, plus dataset parsing for CSV/XLSX.
    "python-multipart>=0.0.18,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# pandas/openpyxl ship no stubs; the optional stub packages are heavy and lag
# behind releases, so these imports are untyped at the boundary only.
[[tool.mypy.overrides]]
module = ["pandas.*", "openpyxl.*"]
ignore_missing_imports = true

# Fixtures and parametrised cases do not benefit from strict annotations.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SIM300 reads a parametrised `expected` variable as a constant and wants the
# assertion inverted; `actual == expected` is the convention we keep.
"tests/*" = ["SIM300"]
